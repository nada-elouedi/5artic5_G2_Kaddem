version: "3.8"
services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=0000
      - MYSQL_DATABASE=kaddem
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql

  app-kaddem:
    depends_on:
      - mysqldb
    image: raniamatrouh774/kaddem:0.0.2
    restart: on-failure
    ports:
      - "8089:8089"
    environment:
      - SPRING_APPLICATION_JSON={"spring.datasource.url":"jdbc:mysql://mysqldb:3306/kaddem?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC","spring.datasource.username":"root","spring.datasource.password":"0000","spring.jpa.properties.hibernate.dialect":"org.hibernate.dialect.MySQL5Dialect","spring.jpa.hibernate.ddl-auto":"update"}
    stdin_open: true
    tty: true

volumes:
  db:
