#Server configuration
server.servlet.context-path=/kaddem
management.endpoints.web.base-path=/kaddem/actuator/prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
logging.level.org.springframework.boot.actuate=DEBUG
server.port=8089

### DATABASE ###
spring.datasource.url=jdbc:mysql://mysql-db:3306/kaddem?&createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=0000

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
