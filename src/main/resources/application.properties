# Server configuration
server.servlet.context-path=/kaddem
server.port=8089

### DATABASE ###
spring.datasource.url=jdbc:mysql://mysql-db:3306/kaddemdb?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=0000

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
logging.level.org.springframework.web=DEBUG
logging.level.tn.esprit.spring.kaddem=DEBUG

# Exposer les endpoints de l'Actuator
management.endpoints.web.exposure.include=health,info,prometheus

# Activer l'endpoint Prometheus
management.endpoint.prometheus.enabled=true

# Port pour l'Actuator (port distinct de celui de l'application principale)
management.server.port=8081  

# Optionnel: Pour activer le logging des métriques
management.metrics.enable.all=true
